name: ui-refresh-build

on:
  push:
    branches:
      - ui/project-experiment-refresh

permissions:
  contents: write

jobs:
  build-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/project-experiment-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check plugin/main.js
      - name: Commit generated bundle
        shell: pwsh
        run: |
          if (git status --porcelain -- plugin/main.js) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugin/main.js
            git commit -m "Build plugin bundle for UI refresh"
            git push origin HEAD:ui/project-experiment-refresh
          }
